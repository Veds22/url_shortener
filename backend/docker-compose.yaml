services:
  db:
    image: postgres:15
    container_name: url_shortener_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -p 5432 -U url_user_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: url_shortener_app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always
  
  redis:
    image: "redis:7"
    container_name: url_shortener_redis
    restart: always
    ports:
      - "6379:6379"
  
  worker:
    build: .
    container_name: url_shortener_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    restart: always

  beat:
    build: .
    container_name: url_shortener_beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data:

